name: Repo Dispatcher

# 手动触发单个目标的编译（原版会一次触发 25 个目标）。
# 也可以绕过本工作流，直接发 repository_dispatch：
#   gh api repos/<owner>/<repo>/dispatches -f event_type=x86_64 -f 'client_payload[target]=x86_64'
on:
  workflow_dispatch:
    inputs:
      target:
        description: '编译目标（devices/ 下的目录名）'
        required: true
        default: 'x86_64'
      param:
        description: '附加参数，空格分隔（nocache / notg / tags / ssh）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Compile
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TARGET: ${{ github.event.inputs.target }}
        PARAM: ${{ github.event.inputs.param }}
      run: |
        [[ "$TARGET" =~ ^[a-z0-9_]+$ ]] || { echo "非法 target: $TARGET"; exit 1; }
        gh api "repos/${{ github.repository }}/dispatches" \
          -f event_type="$TARGET $PARAM" \
          -f "client_payload[target]=$TARGET"
