name: Repo Dispatcher

# 手动触发单个目标的编译。参数也可以用 docs/index.html 页面提交。
#   gh workflow run "Repo Dispatcher" -f target=x86_64 -f options='{"theme":"luci-theme-argon","packages":["luci-app-ttyd"]}'
on:
  workflow_dispatch:
    inputs:
      target:
        description: '编译目标（devices/ 下的目录名）'
        required: true
        default: 'x86_64'
      param:
        description: '附加参数，空格分隔（nocache / notg / tags / ssh）'
        required: false
        default: ''
      options:
        description: '自定义参数 JSON（见 docs/catalog.json；不要放密码）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Compile
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TARGET: ${{ github.event.inputs.target }}
        PARAM: ${{ github.event.inputs.param }}
        OPTIONS: ${{ github.event.inputs.options }}
      run: |
        [[ "$TARGET" =~ ^[a-z0-9_]+$ ]] || { echo "非法 target: $TARGET"; exit 1; }
        [ -n "$OPTIONS" ] || OPTIONS=null
        jq -n --arg t "$TARGET" --arg e "$TARGET $PARAM" --argjson o "$OPTIONS" \
          '{event_type: $e, client_payload: {target: $t, options: $o}}' \
          | gh api "repos/${{ github.repository }}/dispatches" --input -
